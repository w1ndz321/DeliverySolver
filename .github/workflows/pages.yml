name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static introduction page
        run: |
          mkdir -p public
          cp frontend/index.html frontend/styles.css frontend/app.js public/
          python3 - <<'PY'
          from pathlib import Path

          index = Path("public/index.html")
          html = index.read_text(encoding="utf-8")
          html = html.replace('href="./demo.html"', 'href="https://github.com/w1ndz321/DeliverySolver#部署"')
          html = html.replace(">进入 Demo<", ">Demo 部署说明<")
          index.write_text(html, encoding="utf-8")
          PY

      - name: Upload static frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
