name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static introduction page
        run: |
          python3 scripts/build_static_demo_fallback.py
          mkdir -p public
          cp frontend/index.html frontend/styles.css frontend/app.js frontend/demo.html frontend/demo.css frontend/demo.js frontend/demo-fallback.js public/
          python3 - <<'PY'
          from pathlib import Path

          index = Path("public/index.html")
          html = index.read_text(encoding="utf-8")
          index.write_text(html, encoding="utf-8")

          demo = Path("public/demo.html")
          demo_html = demo.read_text(encoding="utf-8")
          demo_html = demo_html.replace('href="/demo.css"', 'href="./demo.css"')
          demo_html = demo_html.replace('src="/demo-fallback.js', 'src="./demo-fallback.js')
          demo_html = demo_html.replace('src="/demo.js', 'src="./demo.js')
          demo_html = demo_html.replace('href="/"', 'href="./"')
          demo.write_text(demo_html, encoding="utf-8")
          PY

      - name: Upload static frontend
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
